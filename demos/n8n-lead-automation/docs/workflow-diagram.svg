<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Flow: website inquiry, validate, duplicate check, qualify, route by band, CRM, notify, draft, human approval, respond.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7b8794"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#c7d0d9;stroke-width:1.5;rx:10}
      .code{fill:#eef6ff;stroke:#8fb9e8}
      .http{fill:#fff5e8;stroke:#e8b36f}
      .gate{fill:#f3edff;stroke:#b39ae0}
      .end{fill:#eafaf0;stroke:#84cfa4}
      .err{fill:#fdeeee;stroke:#e39a98}
      .t{font-size:13px;fill:#1f2a33}
      .s{font-size:11px;fill:#5d6b78}
      .e{stroke:#7b8794;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lbl{font-size:10.5px;fill:#5d6b78}
    </style>
  </defs>
  <rect width="1180" height="560" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1f2a33">Inbound lead qualification — n8n workflow</text>
  <text x="24" y="54" class="s">Website inquiry → validation → duplicate check → scoring → routing → CRM → notification → drafted reply → human approval</text>

  <rect class="box" x="24" y="90" width="150" height="56" rx="10"/>
  <text class="t" x="38" y="114">Website inquiry</text><text class="s" x="38" y="132">POST /inbound-lead</text>

  <rect class="box code" x="206" y="90" width="150" height="56" rx="10"/>
  <text class="t" x="220" y="114">Validate</text><text class="s" x="220" y="132">schema · honeypot</text>

  <rect class="box gate" x="388" y="90" width="130" height="56" rx="10"/>
  <text class="t" x="402" y="114">Valid?</text><text class="s" x="402" y="132">yes / no</text>

  <rect class="box err" x="388" y="200" width="130" height="50" rx="10"/>
  <text class="t" x="402" y="230">422 reject</text>

  <rect class="box code" x="550" y="90" width="150" height="56" rx="10"/>
  <text class="t" x="564" y="114">Duplicate check</text><text class="s" x="564" y="132">30-day window</text>

  <rect class="box code" x="732" y="90" width="150" height="56" rx="10"/>
  <text class="t" x="746" y="114">Qualify</text><text class="s" x="746" y="132">score 0–100</text>

  <rect class="box gate" x="914" y="90" width="150" height="56" rx="10"/>
  <text class="t" x="928" y="114">Route by band</text><text class="s" x="928" y="132">hot · warm · cold</text>

  <rect class="box http" x="914" y="200" width="150" height="56" rx="10"/>
  <text class="t" x="928" y="224">Create CRM record</text><text class="s" x="928" y="242">retry ×3 · 10s</text>

  <rect class="box http" x="732" y="300" width="150" height="56" rx="10"/>
  <text class="t" x="746" y="324">Notify sales</text><text class="s" x="746" y="342">Slack</text>

  <rect class="box code" x="914" y="300" width="150" height="56" rx="10"/>
  <text class="t" x="928" y="324">Draft follow-up</text><text class="s" x="928" y="342">fixed fragments</text>

  <rect class="box http" x="914" y="396" width="150" height="56" rx="10"/>
  <text class="t" x="928" y="420">Human approval</text><text class="s" x="928" y="438">nothing auto-sent</text>

  <rect class="box code" x="550" y="200" width="150" height="50" rx="10"/>
  <text class="t" x="564" y="230">Log cold lead</text>

  <rect class="box err" x="732" y="396" width="150" height="50" rx="10"/>
  <text class="t" x="746" y="426">Record failure</text>

  <rect class="box end" x="550" y="470" width="514" height="50" rx="10"/>
  <text class="t" x="564" y="500">200 accepted — the webhook always gets an answer</text>

  <path class="e" d="M174 118h28"/>
  <path class="e" d="M356 118h28"/>
  <path class="e" d="M453 146v50"/><text class="lbl" x="459" y="175">invalid</text>
  <path class="e" d="M518 118h28"/><text class="lbl" x="522" y="110">valid</text>
  <path class="e" d="M700 118h28"/>
  <path class="e" d="M882 118h28"/>
  <path class="e" d="M989 146v50"/><text class="lbl" x="995" y="175">hot · warm</text>
  <path class="e" d="M914 118h-40v82h-174"/><text class="lbl" x="706" y="176">cold</text>
  <path class="e" d="M952 256v40h-70"/>
  <path class="e" d="M989 256v40"/>
  <path class="e" d="M989 356v36"/>
  <path class="e" d="M1026 256q40 30 10 60t-154 80"/><text class="lbl" x="1052" y="320">error</text>
  <path class="e" d="M989 452v18h-10"/>
  <path class="e" d="M625 250v220"/>
</svg>
