services:
  - type: web
    name: stockflow-ops
    runtime: node
    plan: free
    rootDir: apps/stockflow
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STOCKFLOW_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://stock.aliarshad.co
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ALLOW_DEMO_RESET
        value: "true"
