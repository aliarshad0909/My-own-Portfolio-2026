services:
  - type: web
    name: financeos-erp
    runtime: node
    plan: free
    rootDir: apps/financeos
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FINANCEOS_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://finance.aliarshad.co
      - key: ALLOW_DEMO_RESET
        value: "true"
