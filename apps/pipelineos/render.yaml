services:
  - type: web
    name: pipelineos-crm
    runtime: node
    plan: free
    rootDir: apps/pipelineos
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://crm.aliarshad.co

