<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="PipelineOS CRM Technical Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="16" fill="url(#bg)"/>
  <text x="48" y="54" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">PIPELINEOS CRM · FULL-STACK SAAS ARCHITECTURE</text>
  <text x="48" y="84" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Multi-Stage Sales Pipeline, Transactional Lead Conversion &amp; PostgreSQL Persistence</text>

  <!-- Client Layer -->
  <rect x="48" y="128" width="320" height="390" rx="14" fill="#172033" stroke="#2d3b55" stroke-width="1.5"/>
  <text x="72" y="162" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">NEXT.JS 16 APP ROUTER UI</text>
  <rect x="72" y="182" width="272" height="52" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="88" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Executive Dashboard &amp; KPIs</text>
  <text x="88" y="223" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pipeline value, win rate, overdue tasks</text>

  <rect x="72" y="246" width="272" height="52" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="88" y="269" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Contacts &amp; Leads Workspace</text>
  <text x="88" y="287" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CRUD, search, timeline, 1-click lead conversion</text>

  <rect x="72" y="310" width="272" height="52" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="88" y="333" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Kanban Deal Pipeline</text>
  <text x="88" y="351" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">6 stages, drag/move, stage audit history</text>

  <rect x="72" y="374" width="272" height="52" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="88" y="397" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Activities &amp; Live Analytics</text>
  <text x="88" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Follow-ups, funnel conversion, rep revenue</text>

  <rect x="72" y="440" width="272" height="56" rx="9" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="88" y="464" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Auth Guard &amp; Demo Reset</text>
  <text x="88" y="482" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">HttpOnly cookie · RBAC · 1-click seeded reset</text>

  <!-- API / Domain Layer -->
  <rect x="440" y="128" width="330" height="390" rx="14" fill="#172033" stroke="#2d3b55" stroke-width="1.5"/>
  <text x="464" y="162" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">REST API &amp; SECURITY LAYER</text>

  <rect x="464" y="182" width="282" height="68" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Session Auth &amp; Rate Limiting</text>
  <text x="480" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">scrypt salted password hashes + SHA-256</text>
  <text x="480" y="239" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">session tokens · Admin / Manager / Rep RBAC</text>

  <rect x="464" y="264" width="282" height="68" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="287" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Zod Input Validation</text>
  <text x="480" y="306" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">/api/contacts · /api/leads · /api/deals</text>
  <text x="480" y="321" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">/api/tasks · /api/analytics · /api/demo/reset</text>

  <rect x="464" y="346" width="282" height="72" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="369" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Transactional Business Logic</text>
  <text x="480" y="388" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Atomic Lead → Contact + Deal conversion</text>
  <text x="480" y="404" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Immutable deal stage history audit entries</text>

  <rect x="464" y="434" width="282" height="62" rx="9" fill="#0f2922" stroke="#10b981"/>
  <text x="480" y="458" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Drizzle ORM (Typed SQL)</text>
  <text x="480" y="476" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Zero raw SQL injection · Versioned migrations</text>

  <!-- Data & Hosting Layer -->
  <rect x="842" y="128" width="310" height="390" rx="14" fill="#172033" stroke="#2d3b55" stroke-width="1.5"/>
  <text x="866" y="162" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">POSTGRESQL SCHEMA &amp; DEPLOY</text>

  <rect x="866" y="182" width="262" height="170" rx="9" fill="#0f172a" stroke="#334155"/>
  <text x="882" y="206" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Relational Tables (8)</text>
  <text x="882" y="228" fill="#cbd5e1" font-family="monospace" font-size="12">• users / sessions</text>
  <text x="882" y="248" fill="#cbd5e1" font-family="monospace" font-size="12">• contacts / contact_notes</text>
  <text x="882" y="268" fill="#cbd5e1" font-family="monospace" font-size="12">• leads</text>
  <text x="882" y="288" fill="#cbd5e1" font-family="monospace" font-size="12">• deals / deal_stage_history</text>
  <text x="882" y="308" fill="#cbd5e1" font-family="monospace" font-size="12">• tasks</text>
  <text x="882" y="334" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Integer cents · Foreign keys · Cascade deletes</text>

  <rect x="866" y="368" width="262" height="128" rx="9" fill="#0f172a" stroke="#475569"/>
  <text x="882" y="392" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Dual Driver Deployment</text>
  <text x="882" y="414" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Production: Neon PostgreSQL + Render</text>
  <text x="882" y="434" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Target URL: crm.aliarshad.co (render.yaml)</text>
  <text x="882" y="458" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Local QA: Persisted PGlite (Postgres)</text>
  <text x="882" y="478" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Same Drizzle schema &amp; SQL migrations</text>

  <!-- Arrows -->
  <line x1="368" y1="280" x2="436" y2="280" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="770" y1="280" x2="838" y2="280" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="770" y1="455" x2="838" y2="455" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow)"/>

  <text x="48" y="574" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Clean-room TypeScript implementation inspired by Marmelab Atomic CRM (MIT). Verified via unit, PostgreSQL integration &amp; Chromium E2E tests.</text>
</svg>

