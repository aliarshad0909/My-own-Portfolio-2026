<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="Creative production feeds development, which feeds AI automation — one continuous pipeline.">
  <defs>
    <linearGradient id="cap-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a5c" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ff7a5c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a5c" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="cap-node" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="760" fill="#0b0d10"/>

  <!-- connecting rail -->
  <line x1="300" y1="380" x2="1300" y2="380" stroke="url(#cap-flow)" stroke-width="3"/>
  <circle cx="560" cy="380" r="4" fill="#ff7a5c"/>
  <circle cx="800" cy="380" r="4" fill="#ff7a5c"/>
  <circle cx="1040" cy="380" r="4" fill="#ff7a5c"/>

  <!-- three stage nodes -->
  <g>
    <circle cx="300" cy="380" r="118" fill="url(#cap-node)" stroke="#30363b" stroke-width="1.5"/>
    <circle cx="300" cy="380" r="118" fill="none" stroke="#ff7a5c" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="300" y="356" text-anchor="middle" fill="#f9f6f0" font-family="'Space Grotesk',system-ui,sans-serif" font-size="30" font-weight="600">Create</text>
    <text x="300" y="396" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">Brand · 3D</text>
    <text x="300" y="422" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">Video · Design</text>
  </g>
  <g>
    <circle cx="800" cy="380" r="118" fill="url(#cap-node)" stroke="#30363b" stroke-width="1.5"/>
    <circle cx="800" cy="380" r="118" fill="none" stroke="#ff7a5c" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="800" y="356" text-anchor="middle" fill="#f9f6f0" font-family="'Space Grotesk',system-ui,sans-serif" font-size="30" font-weight="600">Build</text>
    <text x="800" y="396" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">Next.js · React</text>
    <text x="800" y="422" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">Apps · Commerce</text>
  </g>
  <g>
    <circle cx="1300" cy="380" r="118" fill="url(#cap-node)" stroke="#30363b" stroke-width="1.5"/>
    <circle cx="1300" cy="380" r="118" fill="none" stroke="#ff7a5c" stroke-width="1.5" stroke-opacity="0.45"/>
    <text x="1300" y="356" text-anchor="middle" fill="#f9f6f0" font-family="'Space Grotesk',system-ui,sans-serif" font-size="30" font-weight="600">Automate</text>
    <text x="1300" y="396" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">n8n · AI agents</text>
    <text x="1300" y="422" text-anchor="middle" fill="#a9abb2" font-family="'DM Sans',system-ui,sans-serif" font-size="20">Workflows</text>
  </g>

  <text x="800" y="636" text-anchor="middle" fill="#6f7279" font-family="'DM Sans',system-ui,sans-serif" font-size="22" letter-spacing="0.08em">ONE CONTINUOUS PIPELINE — NO HAND-OFFS</text>
</svg>
