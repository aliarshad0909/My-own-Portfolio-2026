    <text x="24" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Discovery &amp; live review</text>
    <rect x="24" y="174" width="200" height="42" rx="8" fill="url(#coral-bar)" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1"/>
    <text x="40" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">Late-morning overlap</text>

    <text x="24" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Async previews &amp; specs</text>
    <rect x="24" y="268" width="200" height="36" rx="8" fill="#10171c" stroke="#26323b" stroke-width="1"/>
    <text x="40" y="291" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#d9d7d2">Written milestones</text>
  </g>

  <!-- CT -->
  <g transform="translate(612, 178)">
    <rect width="248" height="328" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.6" fill="#ff7a5c">CENTRAL · CT</text>
    <text x="24" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#f9f6f0">Midwest &amp; South</text>
    <text x="24" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#a9abb2">UTC−6 / UTC−5</text>

    <line x1="24" y1="126" x2="224" y2="126" stroke="#232f38" stroke-width="1"/>
    <text x="24" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Discovery &amp; live review</text>
    <rect x="24" y="174" width="200" height="42" rx="8" fill="url(#coral-bar)" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1"/>
    <text x="40" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">Midday sync window</text>

    <text x="24" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Async previews &amp; specs</text>
    <rect x="24" y="268" width="200" height="36" rx="8" fill="#10171c" stroke="#26323b" stroke-width="1"/>
    <text x="40" y="291" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#d9d7d2">Video walkthroughs</text>
  </g>

  <!-- ET -->
  <g transform="translate(886, 178)">
    <rect width="250" height="328" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.6" fill="#ff7a5c">EASTERN · ET</text>
    <text x="24" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#f9f6f0">East Coast</text>
    <text x="24" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#a9abb2">UTC−5 / UTC−4</text>

    <line x1="24" y1="126" x2="226" y2="126" stroke="#232f38" stroke-width="1"/>
    <text x="24" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Discovery &amp; live review</text>
    <rect x="24" y="174" width="202" height="42" rx="8" fill="url(#coral-bar)" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1"/>
    <text x="40" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">Core working overlap</text>

    <text x="24" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Async previews &amp; specs</text>
    <rect x="24" y="268" width="202" height="36" rx="8" fill="#10171c" stroke="#26323b" stroke-width="1"/>
    <text x="40" y="291" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#d9d7d2">Direct repo hand-off</text>
  </g>

  <!-- Footer Summary Strip -->
  <g transform="translate(64, 566)">
    <rect width="340" height="94" rx="10" fill="#141d22" stroke="#253038" stroke-width="1.5"/>
    <text x="22" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.2" fill="#ff7a5c">01 · ONE CONTACT</text>
    <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#f9f6f0">Direct studio execution, no hand-offs</text>

    <rect x="366" width="340" height="94" rx="10" fill="#141d22" stroke="#253038" stroke-width="1.5"/>
    <text x="388" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.2" fill="#ff7a5c">02 · WRITTEN SCOPE</text>
    <text x="388" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#f9f6f0">Clear specs &amp; reviewable URLs</text>

    <rect x="732" width="340" height="94" rx="10" fill="#141d22" stroke="#253038" stroke-width="1.5"/>
    <text x="754" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.2" fill="#ff7a5c">03 · EARNED LOCAL PAGES</text>
    <text x="754" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" fill="#f9f6f0">Published only with real local proof</text>
