<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Remote US studio coverage schematic showing Pacific, Mountain, Central and Eastern time-zone overlap windows and async milestone delivery across all 50 US states and D.C. with zero physical branch offices.">
  <title>Remote Studio Delivery Across US Time Zones</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <linearGradient id="coral-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a5c" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7a5c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff7a5c" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>

  <!-- Subtle architectural divider lines -->
  <g stroke="#1d262e" stroke-width="1">
    <line x1="64" y1="146" x2="1136" y2="146"/>
    <line x1="64" y1="538" x2="1136" y2="538"/>
  </g>

  <!-- Header -->
  <text x="64" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">REMOTE OPERATING MODEL · 50 US STATES + D.C.</text>
  <text x="64" y="110" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#f9f6f0">US Time-Zone Overlap &amp; Staged Delivery</text>

  <!-- Status pill -->
  <rect x="838" y="74" width="298" height="40" rx="20" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
  <circle cx="864" cy="94" r="5" fill="#ff7a5c"/>
  <text x="880" y="99" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#f9f6f0">100% Remote · Zero Branch Offices</text>

  <!-- 4 Time-Zone Columns -->
  <!-- PT -->
  <g transform="translate(64, 178)">
    <rect width="248" height="328" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.6" fill="#ff7a5c">PACIFIC · PT</text>
    <text x="24" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#f9f6f0">West Coast</text>
    <text x="24" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#a9abb2">UTC−8 / UTC−7</text>

    <line x1="24" y1="126" x2="224" y2="126" stroke="#232f38" stroke-width="1"/>
    <text x="24" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Discovery &amp; live review</text>
    <rect x="24" y="174" width="200" height="42" rx="8" fill="url(#coral-bar)" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1"/>
    <text x="40" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">Morning sync window</text>

    <text x="24" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#a9abb2">Async previews &amp; specs</text>
    <rect x="24" y="268" width="200" height="36" rx="8" fill="#10171c" stroke="#26323b" stroke-width="1"/>
    <text x="40" y="291" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#d9d7d2">Staged build links</text>
  </g>

  <!-- MT -->
  <g transform="translate(338, 178)">
    <rect width="248" height="328" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="1.6" fill="#ff7a5c">MOUNTAIN · MT</text>
    <text x="24" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#f9f6f0">Mountain West</text>
    <text x="24" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#a9abb2">UTC−7 / UTC−6</text>

