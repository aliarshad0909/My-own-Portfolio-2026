<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Comparison chart contrasting Zapier per-task step billing growth against n8n per-execution or self-hosted flat server scaling, alongside branching, custom JavaScript code nodes and data-residency trade-offs.">
  <title>n8n vs Zapier Scaling Curve and Architectural Control Comparison</title>
  <defs>
    <linearGradient id="bg-rnz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-rnz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-rnz" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-rnz)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">PLATFORM COMPARISON · N8N VS ZAPIER</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Per-Task Step Multiplier vs Per-Execution Control</text>
  <g transform="translate(906, 68)">
    <rect width="238" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Architectural Trade-Off Map</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <!-- Left: Cost Scaling Curve -->
  <g transform="translate(56, 170)">
    <rect width="584" height="486" rx="12" fill="#10161b" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">HOW MULTI-STEP LOOPS SCALE COST (DIRECTIONAL)</text>

    <!-- Chart Frame -->
    <line x1="64" y1="390" x2="540" y2="390" stroke="#354652" stroke-width="1.5"/>
    <line x1="64" y1="90" x2="64" y2="390" stroke="#354652" stroke-width="1.5"/>

    <!-- Zapier Steep Curve -->
    <path d="M64 378 Q250 326 520 112" stroke="#ff9a8a" stroke-width="3.2" fill="none"/>
    <text x="348" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="600" fill="#ff9a8a">Zapier (billed per task step)</text>
    <text x="348" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">15-step loops × volume climb steeply</text>

    <!-- n8n Cloud Moderate Curve -->
    <path d="M64 378 L520 264" stroke="#ff7a5c" stroke-width="2.6" stroke-dasharray="6 4" fill="none"/>
    <text x="320" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#ff7a5c">n8n Cloud (per execution)</text>

    <!-- n8n Self-Hosted Flat Step -->
    <path d="M64 352 H520" stroke="#7ed3a0" stroke-width="3" fill="none"/>
    <text x="268" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="600" fill="#7ed3a0">n8n Self-Hosted (flat VPS cost)</text>

    <text x="64" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">Low volume (2-step zaps)</text>
    <text x="346" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">High volume (15-step loops)</text>
    <text x="24" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Illustrative scaling shape — not vendor pricing quotes.</text>
  </g>

  <!-- Right: When Each Wins -->
  <g transform="translate(668, 170)">
    <rect width="476" height="226" rx="12" fill="#141d22" stroke="#2c3b46" stroke-width="1.5"/>
    <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#a9abb2">STAY ON ZAPIER WHEN</text>
    <text x="24" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Simple 2–3 Step Personal Glue</text>
    <text x="24" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#d9d7d2">• Linear triggers (Form → Sheet → Slack)</text>
    <text x="24" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#d9d7d2">• Low monthly task volume</text>
    <text x="24" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#d9d7d2">• Zero custom code or self-hosting needs</text>
    <text x="24" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Do not migrate just for the sake of migrating.</text>

    <rect y="254" width="476" height="232" rx="12" fill="#1c1818" stroke="#ff7a5c" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="24" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">CHOOSE N8N WHEN</text>
    <text x="24" y="324" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Production Business Workflows</text>
    <text x="24" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#f9f6f0">• Multi-branch scoring, loops &amp; deduplication</text>
    <text x="24" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#f9f6f0">• First-class JavaScript Code nodes + tests</text>
    <text x="24" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#f9f6f0">• Global Error Trigger workflows &amp; retries</text>
    <text x="24" y="450" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#e6dedb">• Exportable Git JSON &amp; optional self-hosting</text>
  </g>
  
</svg>
