<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Two-by-two effort matrix showing why custom asset creation, animation density, multi-ratio channel cutdowns and revision depth drive motion graphics budgets far more than raw video runtime.">
  <title>Motion Graphics Pricing Drivers: Asset Complexity vs Runtime</title>
  <defs>
    <linearGradient id="bg-rmp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-rmp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-rmp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-rmp)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">CREATIVE PRODUCTION GUIDE · BUDGET DRIVERS</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Why Asset Complexity Drives Motion Cost More Than Runtime</text>
  <g transform="translate(908, 68)">
    <rect width="236" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Lock Script Before Animating</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <!-- Left: 2x2 Quadrant -->
  <g transform="translate(56, 170)">
    <rect width="584" height="486" rx="12" fill="#10161b" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">EFFORT MATRIX (COMPLEXITY VS RUNTIME)</text>

    <!-- Quadrant Boxes -->
    <g transform="translate(54, 72)">
      <!-- Top Left: Short + High Complexity -->
      <rect width="244" height="172" rx="10" fill="#1c1818" stroke="#ff7a5c" stroke-opacity="0.75" stroke-width="1.6"/>
      <text x="18" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#ff7a5c">SHORT · HIGH CRAFT</text>
      <text x="18" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f9f6f0">20s Bespoke UI / 3D</text>
      <text x="18" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#e6dedb">Custom UI components,</text>
      <text x="18" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#e6dedb">sound design &amp; 3 ratios.</text>
      <text x="18" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">Higher production effort</text>

      <!-- Top Right: Long + High Complexity -->
      <rect x="260" width="244" height="172" rx="10" fill="#171e25" stroke="#3c4f5d" stroke-width="1.5"/>
      <text x="278" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#ff9a8a">LONG · HIGH CRAFT</text>
      <text x="278" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f9f6f0">60–90s Launch Film</text>
      <text x="278" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">Full storyboard, custom</text>
      <text x="278" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">scenes, 3D &amp; campaign kit.</text>
      <text x="278" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff9a8a">Flagship campaign scope</text>

      <!-- Bottom Left: Short + Low Complexity -->
      <rect y="188" width="244" height="172" rx="10" fill="#13221c" stroke="#478767" stroke-width="1.5"/>
      <text x="18" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#7ed3a0">SHORT · LEAN ASSETS</text>
      <text x="18" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f9f6f0">15s Brand Sting / Cut</text>
      <text x="18" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">Supplied SVG lockups,</text>
      <text x="18" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">clean kinetic type.</text>
      <text x="18" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#7ed3a0">Fastest turnaround</text>

      <!-- Bottom Right: Long + Low Complexity -->
      <rect x="260" y="188" width="244" height="172" rx="10" fill="#141d22" stroke="#2c3b46" stroke-width="1.5"/>
      <text x="278" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#a9abb2">LONG · LEAN ASSETS</text>
      <text x="278" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#f9f6f0">60s Founder Edit</text>
      <text x="278" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">Clean raw footage with</text>
      <text x="278" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">lower-thirds &amp; captions.</text>
      <text x="278" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">Moderate, predictable effort</text>
    </g>

    <text x="54" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">← Shorter Runtime                                                          Longer Runtime →</text>
  </g>

  <!-- Right: 3 Budget Protectors -->
  <g transform="translate(668, 170)">
    <rect width="476" height="486" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="24" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">HOW TO GET MORE VALUE PER BUDGET</text>
    <text x="24" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="600" fill="#f9f6f0">Three High-Leverage Briefing Rules</text>

    <rect x="24" y="98" width="428" height="106" rx="10" fill="#10171c" stroke="#26323b"/>
    <text x="42" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">01 · Lock Script &amp; Beats First</text>
    <text x="42" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Editing a line in Docs takes 2 minutes;</text>
    <text x="42" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">changing timing after animation costs hours.</text>

    <rect x="24" y="220" width="428" height="106" rx="10" fill="#10171c" stroke="#26323b"/>
    <text x="42" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">02 · Supply Vector Brand Tokens</text>
    <text x="42" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Logo SVGs, fonts &amp; hex tokens on day one</text>
    <text x="42" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">eliminate style-frame guesswork.</text>

    <rect x="24" y="342" width="428" height="114" rx="10" fill="#1c1818" stroke="#ff7a5c" stroke-opacity="0.5"/>
    <text x="42" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">03 · Plan 9:16 &amp; 4:5 Cutdowns Early</text>
    <text x="42" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#e6dedb">Composing safe zones from frame one makes</text>
    <text x="42" y="426" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#e6dedb">multi-channel ad exports far more economical.</text>
  </g>
  
</svg>
