<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Technical SEO diagram for Next.js App Router illustrating metadataBase canonical resolution, generateStaticParams alignment with sitemap.ts, honest JSON-LD schema, Core Web Vitals protection and CI audit checks.">
  <title>Next.js App Router Technical SEO Pipeline</title>
  <defs>
    <linearGradient id="bg-rnseo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-rnseo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-rnseo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-rnseo)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">WEB ENGINEERING GUIDE · NEXT.JS APP ROUTER SEO</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Six Technical SEO Primitives Enforced in Code</text>
  <g transform="translate(914, 68)">
    <rect width="230" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Tested in CI · Zero Plugins</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <g transform="translate(56, 174)">
    <!-- Row 1 -->
    <rect width="342" height="196" rx="12" fill="#141d22" stroke="#ff7a5c" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">01 · CANONICAL ORIGIN</text>
    <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">metadataBase &amp; robots.ts</text>
    <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Production resolves to exact</text>
    <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">canonical host; preview deploys</text>
    <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">stay strictly noindex.</text>

    <g transform="translate(373, 0)">
      <rect width="342" height="196" rx="12" fill="#141d22" stroke="#2a3741" stroke-width="1.5"/>
      <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">02 · INTENT OWNERSHIP</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">One Query → One URL</text>
      <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Unique titles, descriptions &amp; H1s</text>
      <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">prevent services, guides and</text>
      <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">spokes from cannibalising.</text>
    </g>

    <g transform="translate(746, 0)">
      <rect width="342" height="196" rx="12" fill="#141d22" stroke="#2a3741" stroke-width="1.5"/>
      <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">03 · HONEST SCHEMA</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Substantiated JSON-LD</text>
      <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Service, Article, BreadcrumbList</text>
      <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">&amp; FAQPage matching visible page</text>
      <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">content — zero fake ratings.</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 224)">
      <rect width="342" height="196" rx="12" fill="#141d22" stroke="#2a3741" stroke-width="1.5"/>
      <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">04 · SITEMAP PARITY</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Static Params = Sitemap</text>
      <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Gated or draft routes return 404</text>
      <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">in production and never leak</text>
      <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">into sitemap.xml.</text>
    </g>

    <g transform="translate(373, 224)">
      <rect width="342" height="196" rx="12" fill="#141d22" stroke="#2a3741" stroke-width="1.5"/>
      <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">05 · CORE WEB VITALS</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Server-First Delivery</text>
      <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Explicit next/image dimensions,</text>
      <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">scoped client islands and zero</text>
      <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">heavy UI framework bloat.</text>
    </g>

    <g transform="translate(746, 224)">
      <rect width="342" height="196" rx="12" fill="#13221c" stroke="#478767" stroke-width="1.5"/>
      <text x="22" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#7ed3a0">06 · AUTOMATED AUDIT</text>
      <text x="22" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">CI Link &amp; Gate Checks</text>
      <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Automated seo:audit catches</text>
      <text x="22" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">broken internal links, duplicate</text>
      <text x="22" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">slugs &amp; missing evidence early.</text>
    </g>
  </g>

  <text x="56" y="654" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">This exact architecture runs on aliarshad.co (Next.js 16 App Router + automated seo:audit).</text>
  
</svg>
