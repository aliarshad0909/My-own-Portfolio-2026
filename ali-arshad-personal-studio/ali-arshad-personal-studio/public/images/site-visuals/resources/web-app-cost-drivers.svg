<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Editorial infographic comparing five custom web application cost drivers — workflow depth, integrations, design system, data integrity and calendar compression — alongside a lean v1 phasing strategy.">
  <title>Five Custom Web Application Cost Drivers and v1 Scope Phasing</title>
  <defs>
    <linearGradient id="bg-rwc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-rwc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-rwc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-rwc)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">WEB ENGINEERING GUIDE · COST STRUCTURE</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">What Actually Moves a Custom Web App Budget</text>
  <g transform="translate(918, 68)">
    <rect width="226" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Cut Scope, Never Quality</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <g transform="translate(56, 170)">
    <!-- 5 Driver Cards in 2-col editorial grid + right phasing stack -->
    <rect width="656" height="486" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="26" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">FIVE PREDICTABLE BUDGET DRIVERS</text>

    <g transform="translate(26, 60)">
      <rect width="604" height="70" rx="9" fill="#10171c" stroke="#253038"/>
      <text x="18" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">01 · Screen &amp; Workflow Depth</text>
      <text x="18" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Static pages vs multi-role portals, filters, state machines &amp; admin CRUD</text>

      <rect y="82" width="604" height="70" rx="9" fill="#10171c" stroke="#253038"/>
      <text x="18" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">02 · External Integrations</text>
      <text x="18" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Each API (Stripe, HubSpot, Shopify, ERP) adds mapping, retries &amp; edge tests</text>

      <rect y="164" width="604" height="70" rx="9" fill="#10171c" stroke="#253038"/>
      <text x="18" y="193" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">03 · Design System vs Adapted Base</text>
      <text x="18" y="217" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Bespoke editorial typography &amp; tokens vs reusing an existing component base</text>

      <rect y="246" width="604" height="70" rx="9" fill="#10171c" stroke="#253038"/>
      <text x="18" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">04 · Data Integrity &amp; Permissions</text>
      <text x="18" y="299" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Append-only ledgers, integer-cent commerce rules &amp; role-based access</text>

      <rect y="328" width="604" height="70" rx="9" fill="#10171c" stroke="#253038"/>
      <text x="18" y="357" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">05 · Calendar Compression</text>
      <text x="18" y="381" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Rush deadlines shrink review loops and increase regression risk</text>
    </g>

    <!-- Right: Smart Phasing -->
    <g transform="translate(686, 0)">
      <rect width="402" height="486" rx="12" fill="#12181e" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="26" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">HOW TO PROTECT BUDGET</text>
      <text x="26" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="600" fill="#f9f6f0">Ship Cleanly in Two Phases</text>

      <rect x="26" y="98" width="350" height="154" rx="10" fill="#172229" stroke="#7ed3a0" stroke-opacity="0.6"/>
      <text x="44" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#7ed3a0">PHASE 1 · PROVE THE CORE</text>
      <text x="44" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#f9f6f0">• 1 complete core user journey</text>
      <text x="44" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#f9f6f0">• Day-one integrations only</text>
      <text x="44" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#f9f6f0">• Pure TS domain + automated tests</text>
      <text x="44" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Fast launch, zero throwaway code</text>

      <path d="M201 252 V288" stroke="#ff7a5c" stroke-width="2" marker-end="url(#arrc-rwc)"/>

      <rect x="26" y="294" width="350" height="164" rx="10" fill="#141d22" stroke="#2c3b46"/>
      <text x="44" y="326" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">PHASE 2 · EXPAND ON EVIDENCE</text>
      <text x="44" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#d9d7d2">• Secondary tabs &amp; power filters</text>
      <text x="44" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#d9d7d2">• Extra CRM / ERP connectors</text>
      <text x="44" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#d9d7d2">• Built directly on v1 architecture</text>
      <text x="44" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Funded by real user feedback</text>
    </g>
  </g>
  
</svg>
