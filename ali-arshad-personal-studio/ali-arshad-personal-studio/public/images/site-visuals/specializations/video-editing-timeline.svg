<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Editorial multi-track video editing timeline showing a two-second hook, story arc, call to action, caption track, levelled audio mix, and clean 16:9, 4:5 and 9:16 exports.">
  <title>Video Editing Timeline and Multi-Ratio Delivery Composition</title>
  <defs>
    <linearGradient id="bg-ve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-ve" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-ve" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
    
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-ve)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">VIDEO EDITING · PACING &amp; MULTI-TRACK STRUCTURE</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Hook-First Editing Timeline &amp; Channel Exports</text>
  <g transform="translate(920, 68)">
    <rect width="224" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">16:9 · 4:5 · 9:16 Masters</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <!-- Timecode Ruler -->
  <g transform="translate(56, 162)">
    <rect width="1088" height="36" rx="8" fill="#141d22" stroke="#253038"/>
    <text x="160" y="23" font-family="ui-monospace, monospace" font-size="13" fill="#ff7a5c">00:00  HOOK (0–2s)</text>
    <text x="380" y="23" font-family="ui-monospace, monospace" font-size="13" fill="#a9abb2">00:05  PROBLEM &amp; PROOF</text>
    <text x="690" y="23" font-family="ui-monospace, monospace" font-size="13" fill="#a9abb2">00:18  PRODUCT DETAIL</text>
    <text x="955" y="23" font-family="ui-monospace, monospace" font-size="13" fill="#f9f6f0">00:28  CTA</text>
  </g>

  <!-- Playhead vertical coral line -->
  <line x1="216" y1="162" x2="216" y2="486" stroke="#ff7a5c" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="208,162 224,162 216,174" fill="#ff7a5c"/>

  <!-- Tracks -->
  <!-- V2 Captions / Titles -->
  <g transform="translate(56, 212)">
    <rect width="128" height="58" rx="8" fill="#171e25" stroke="#26323b"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#ff7a5c">V2 · TYPE</text>
    <text x="16" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#d9d7d2">Safe Captions</text>

    <rect x="142" width="180" height="58" rx="8" fill="#231917" stroke="#ff7a5c" stroke-opacity="0.7"/>
    <text x="158" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Opening Hook Title</text>

    <rect x="334" width="320" height="58" rx="8" fill="#172027" stroke="#2e3d48"/>
    <text x="350" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Brand-Matched Kinetic Captions</text>

    <rect x="666" width="246" height="58" rx="8" fill="#172027" stroke="#2e3d48"/>
    <text x="682" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Feature Callouts</text>

    <rect x="924" width="164" height="58" rx="8" fill="#231917" stroke="#ff7a5c" stroke-opacity="0.7"/>
    <text x="942" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#ff7a5c">End Card + URL</text>
  </g>

  <!-- V1 Primary Footage -->
  <g transform="translate(56, 282)">
    <rect width="128" height="68" rx="8" fill="#171e25" stroke="#26323b"/>
    <text x="16" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#f9f6f0">V1 · CUT</text>
    <text x="16" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">A-Roll / B-Roll</text>

    <rect x="142" width="144" height="68" rx="8" fill="#1b262e" stroke="#3c4f5d"/>
    <text x="156" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Pattern Break</text>
    <text x="156" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">0.0s–2.0s visual</text>

    <rect x="296" width="210" height="68" rx="8" fill="#162027" stroke="#2e3d48"/>
    <text x="312" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Founder / Context Cut</text>
    <text x="312" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Tight J-cut transitions</text>

    <rect x="516" width="234" height="68" rx="8" fill="#1b262e" stroke="#3c4f5d"/>
    <text x="532" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Product Demo B-Roll</text>
    <text x="532" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Paced cuts + grade match</text>

    <rect x="760" width="166" height="68" rx="8" fill="#162027" stroke="#2e3d48"/>
    <text x="776" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Proof / Result</text>
    <text x="776" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Clean UI / close-up</text>

    <rect x="936" width="152" height="68" rx="8" fill="#1b262e" stroke="#3c4f5d"/>
    <text x="952" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#f9f6f0">Resolve</text>
    <text x="952" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Logo lockup</text>
  </g>

  <!-- A1 Voiceover & Mix -->
  <g transform="translate(56, 362)">
    <rect width="128" height="54" rx="8" fill="#171e25" stroke="#26323b"/>
    <text x="16" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#7ed3a0">A1 · VO</text>
    <text x="16" y="43" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">−14 LUFS Mix</text>

    <rect x="142" width="946" height="54" rx="8" fill="#121c20" stroke="#24383b"/>
    <path d="M162 27 Q182 10 202 27 T242 27 T282 27 T322 27 T362 27 T402 27 T442 27 T482 27 T522 27 T562 27 T602 27 T642 27 T682 27 T722 27 T762 27 T802 27 T842 27 T882 27 T922 27 T962 27 T1002 27 T1042 27" stroke="#7ed3a0" stroke-opacity="0.7" stroke-width="2" fill="none"/>
    <text x="162" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">Dialogue EQ, de-noise, breath trim &amp; ducked music bed</text>
  </g>

  <!-- A2 Grade / Mastering -->
  <g transform="translate(56, 428)">
    <rect width="128" height="46" rx="8" fill="#171e25" stroke="#26323b"/>
    <text x="16" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#a9abb2">FX · GRADE</text>
    <rect x="142" width="946" height="46" rx="8" fill="#141d22" stroke="#253038"/>
    <text x="162" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">Consistent exposure &amp; brand colour balance across camera, screen recording &amp; phone clips</text>
  </g>

  <!-- Export Pack Strip -->
  <g transform="translate(56, 514)">
    <rect width="346" height="146" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="22" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">16:9 · WEB &amp; YOUTUBE</text>
    <text x="22" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#f9f6f0">H.264 +faststart &amp; VP9</text>
    <text x="22" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Poster still + 6s muted hover loop</text>
    <text x="22" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">probed via ffprobe for web speed.</text>

    <rect x="371" width="346" height="146" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="393" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">4:5 · PAID SOCIAL FEED</text>
    <text x="393" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#f9f6f0">Re-Framed Feed Cut</text>
    <text x="393" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Intentional crop keeping product &amp;</text>
    <text x="393" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">captions crisp in mobile feeds.</text>

    <rect x="742" width="346" height="146" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="764" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">9:16 · REELS / TIKTOK / SHORTS</text>
    <text x="764" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#f9f6f0">Safe-Zone Vertical Cut</text>
    <text x="764" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Titles and CTAs clear of platform</text>
    <text x="764" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">overlay buttons &amp; captions.</text>
  </g>
  
</svg>
