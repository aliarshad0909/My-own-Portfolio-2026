<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Architecture diagram illustrating a grounded AI agent: user question enters BM25 or hybrid retrieval over approved docs, passes a tuned confidence floor threshold, either returning a source-cited answer or escalating directly to a human with full transcript.">
  <title>Grounded AI Agent Retrieval and Confidence Floor Escalation Diagram</title>
  <defs>
    <linearGradient id="bg-ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
    
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-ag)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">AI AGENT GUARDRAILS · RETRIEVAL &amp; ESCALATION</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Confidence-Floor Routing Prevents Hallucinated Policy</text>
  <g transform="translate(896, 68)">
    <rect width="248" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Inspectable Scores · Human Floor</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <!-- Query + Retrieval -->
  <g transform="translate(56, 184)">
    <rect width="230" height="214" rx="12" fill="#141d22" stroke="#2a3741" stroke-width="1.5"/>
    <text x="20" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">01 · USER QUERY</text>
    <text x="20" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="600" fill="#f9f6f0">Inbound Question</text>
    <text x="20" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#a9abb2">Web chat, help widget,</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#a9abb2">Slack or voice input</text>
    <rect x="20" y="152" width="190" height="38" rx="7" fill="#10171c" stroke="#26323b"/>
    <text x="34" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#d9d7d2">Synonym normalisation</text>
  </g>

  <path d="M286 291 H338" stroke="#6f7e8a" stroke-width="2" fill="none" marker-end="url(#arr-ag)"/>

  <g transform="translate(346, 184)">
    <rect width="268" height="214" rx="12" fill="#171e25" stroke="#354652" stroke-width="1.5"/>
    <text x="20" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">02 · RETRIEVAL &amp; SCORE</text>
    <text x="20" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="600" fill="#f9f6f0">Confidence Meter</text>
    <!-- Visual threshold bar -->
    <rect x="20" y="96" width="228" height="24" rx="12" fill="#0d1116" stroke="#26323b"/>
    <rect x="20" y="96" width="114" height="24" rx="12" fill="#3a211c"/>
    <rect x="134" y="96" width="114" height="24" rx="12" fill="#19382a"/>
    <line x1="134" y1="88" x2="134" y2="128" stroke="#ff7a5c" stroke-width="2.5"/>
    <text x="24" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#ff9a8a">Below floor</text>
    <text x="114" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#ff7a5c">Floor</text>
    <text x="176" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#7ed3a0">High match</text>
    <text x="20" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">BM25 / Hybrid score over versioned KB</text>
  </g>

  <!-- Two Paths -->
  <path d="M614 291 H652 V232 H690" stroke="#7ed3a0" stroke-width="2" fill="none" marker-end="url(#arr-ag)"/>
  <path d="M614 291 H652 V352 H690" stroke="#ff7a5c" stroke-width="2" fill="none" marker-end="url(#arrc-ag)"/>

  <g transform="translate(698, 174)">
    <!-- High confidence -->
    <rect width="446" height="106" rx="12" fill="#13221c" stroke="#478767" stroke-width="1.5"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#7ed3a0">SCORE ≥ FLOOR · CITED RESPONSE</text>
    <text x="22" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#f9f6f0">Answer Grounded in Source Document</text>
    <text x="22" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Verbatim policy quote or bounded synthesis + visible article link</text>

    <!-- Below floor -->
    <rect y="128" width="446" height="106" rx="12" fill="#1c1818" stroke="#ff7a5c" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="22" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">SCORE &lt; FLOOR · HUMAN ESCALATION</text>
    <text x="22" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" fill="#f9f6f0">Instant Hand-Off with Transcript &amp; Context</text>
    <text x="22" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#e6dedb">Routes to helpdesk/Slack &amp; logs doc gap for ops review</text>
  </g>

  <!-- Bottom Regression Strip -->
  <g transform="translate(56, 466)">
    <rect width="1088" height="192" rx="12" fill="#12181e" stroke="#253038" stroke-width="1.5"/>
    <text x="28" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#ff7a5c">WHY THIS ARCHITECTURE EARNS TRUST</text>
    <g transform="translate(28, 64)">
      <rect width="324" height="102" rx="9" fill="#141d22" stroke="#26323b"/>
      <text x="18" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">01 · Zero Invented Policy</text>
      <text x="18" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Replies trace directly to approved</text>
      <text x="18" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">articles you edit in seconds.</text>

      <rect x="354" width="324" height="102" rx="9" fill="#141d22" stroke="#26323b"/>
      <text x="372" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">02 · Diagnosable Failures</text>
      <text x="372" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Inspect exact relevance scores</text>
      <text x="372" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">instead of guessing at prompts.</text>

      <rect x="708" width="324" height="102" rx="9" fill="#141d22" stroke="#26323b"/>
      <text x="726" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">03 · Boundary Regression</text>
      <text x="726" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Tests prove both known answers</text>
      <text x="726" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">and out-of-scope escalations.</text>
    </g>
  </g>
  
</svg>
