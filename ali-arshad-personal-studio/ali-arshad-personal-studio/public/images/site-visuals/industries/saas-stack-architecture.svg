<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Architecture diagram for SaaS startups showing a Next.js and TypeScript v1 MVP core connected to embedded SVG analytics dashboards, grounded documentation support agents and n8n onboarding and CRM pipelines.">
  <title>SaaS Startup MVP, Analytics and Automation Architecture</title>
  <defs>
    <linearGradient id="bg-isa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-isa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-isa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
    
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-isa)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">INDUSTRY ARCHITECTURE · SAAS STARTUPS</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Focused MVP Core with Analytics &amp; Guarded Automation</text>
  <g transform="translate(910, 68)">
    <rect width="234" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Concept Architecture · SaaS</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <!-- Top Core SaaS Product Layer -->
  <g transform="translate(56, 174)">
    <rect width="1088" height="184" rx="12" fill="#141d22" stroke="#ff7a5c" stroke-opacity="0.6" stroke-width="1.6"/>
    <text x="28" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#ff7a5c">CORE PRODUCT LAYER · NEXT.JS + TYPESCRIPT + POSTGRESQL</text>
    <g transform="translate(28, 60)">
      <rect width="320" height="98" rx="9" fill="#10171c" stroke="#2a3741"/>
      <text x="18" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">Lean v1 User Workflow</text>
      <text x="18" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Auth, core job-to-be-done &amp; Stripe</text>
      <text x="18" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">shipped in weekly preview builds</text>

      <rect x="356" width="320" height="98" rx="9" fill="#10171c" stroke="#2a3741"/>
      <text x="374" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">Pure Domain &amp; API Layer</text>
      <text x="374" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Unit-tested business rules ready</text>
      <text x="374" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">for seed-stage hires to extend</text>

      <rect x="712" width="320" height="98" rx="9" fill="#10171c" stroke="#2a3741"/>
      <text x="730" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">Embedded SVG Analytics</text>
      <text x="730" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Single-source KPIs, period deltas</text>
      <text x="730" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">&amp; screen-reader accessible tables</text>
    </g>
  </g>

  <!-- Vertical Connectors -->
  <path d="M236 358 V412" stroke="#6f7e8a" stroke-width="2" marker-end="url(#arr-isa)"/>
  <path d="M600 358 V412" stroke="#ff7a5c" stroke-width="2" marker-end="url(#arrc-isa)"/>
  <path d="M964 358 V412" stroke="#6f7e8a" stroke-width="2" marker-end="url(#arr-isa)"/>

  <!-- Bottom 3 Growth & Ops Modules -->
  <g transform="translate(56, 420)">
    <rect width="342" height="236" rx="12" fill="#12181e" stroke="#26323b" stroke-width="1.5"/>
    <text x="22" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">GROWTH &amp; TRIALS</text>
    <text x="22" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Lead Qualification</text>
    <text x="22" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Score demo requests 0–100,</text>
    <text x="22" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">deduplicate in HubSpot and</text>
    <text x="22" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">notify founders in Slack.</text>
    <text x="22" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">n8n + Kestrel qualification pattern</text>

    <g transform="translate(373, 0)">
      <rect width="342" height="236" rx="12" fill="#12181e" stroke="#26323b" stroke-width="1.5"/>
      <text x="22" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">DOCS DEFLECTION</text>
      <text x="22" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Cited Support Agent</text>
      <text x="22" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Answer onboarding &amp; billing</text>
      <text x="22" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">questions from versioned docs;</text>
      <text x="22" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">escalate edge cases cleanly.</text>
      <text x="22" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">Tideline BM25 retrieval pattern</text>
    </g>

    <g transform="translate(746, 0)">
      <rect width="342" height="236" rx="12" fill="#12181e" stroke="#26323b" stroke-width="1.5"/>
      <text x="22" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#ff7a5c">OPERATIONS</text>
      <text x="22" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="600" fill="#f9f6f0">Billing &amp; Reporting</text>
      <text x="22" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Reconcile Stripe webhooks into</text>
      <text x="22" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">founder KPI views and weekly</text>
      <text x="22" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">Workspace digests automatically.</text>
      <text x="22" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a9abb2">Northwind + n8n pipeline pattern</text>
    </g>
  </g>
  
</svg>
