      <text x="38" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#a9abb2">SUPPORTING DEMOS</text>
      <text x="38" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">Meridian + Lantern Platforms</text>
      <text x="38" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a9abb2">110 combined tests (fictional)</text>
