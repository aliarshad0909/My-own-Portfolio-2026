  <g transform="translate(56, 560)">
    <rect width="1088" height="100" rx="12" fill="#12181e" stroke="#253038"/>
    <text x="28" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" fill="#f9f6f0">Evidence-Gated Industry Pages</text>
    <text x="28" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#a9abb2">Additional sectors remain unpublished until substantiated by working software or consented engagements — zero invented client claims.</text>
