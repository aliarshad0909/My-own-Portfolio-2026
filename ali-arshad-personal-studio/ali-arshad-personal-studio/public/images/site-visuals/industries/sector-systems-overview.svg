      <rect x="24" y="244" width="294" height="84" rx="8" fill="#10171c" stroke="#26323b"/>
      <text x="38" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#a9abb2">SUPPORTING DEMO</text>
