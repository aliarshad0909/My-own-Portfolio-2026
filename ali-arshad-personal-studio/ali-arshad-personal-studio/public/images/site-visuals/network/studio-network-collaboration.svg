    <text x="28" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14.5" fill="#a9abb2">You always know what is built directly in-studio and what is delivered with a vetted specialist — zero fake agency claims or implied logos.</text>
