    <text x="22" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">PARTNER-DELIVERED WHEN SCOPED</text>
