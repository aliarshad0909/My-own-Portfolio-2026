<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Diagram explaining how the Web Project Estimator combines project shape, page count, custom design depth, external integrations and timeline urgency into an illustrative budget range.">
  <title>Web Project Estimator Scope Multipliers Diagram</title>
  <defs>
    <linearGradient id="bg-we" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1116"/>
      <stop offset="100%" stop-color="#131b21"/>
    </linearGradient>
    <marker id="arr-we" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6f7e8a"/>
    </marker>
    <marker id="arrc-we" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7a5c"/>
    </marker>
    
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#bg-we)"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="none" stroke="#253038" stroke-width="2"/>
  <text x="56" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.2" fill="#ff7a5c">WEB PROJECT ESTIMATOR · MODEL INPUTS</text>
  <text x="56" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="29" font-weight="600" fill="#f9f6f0">Five Variables Driving Illustrative Build Ranges</text>
  <g transform="translate(914, 68)">
    <rect width="230" height="38" rx="19" fill="#171e25" stroke="#2f3b45" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff7a5c"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="500" fill="#f9f6f0">Planning Band · Not a Quote</text>
  </g>
  <line x1="56" y1="132" x2="1144" y2="132" stroke="#1e2830" stroke-width="1.5"/>
  
  <g transform="translate(56, 174)">
    <!-- 5 horizontal factor meters -->
    <rect width="676" height="482" rx="12" fill="#141d22" stroke="#26323b" stroke-width="1.5"/>
    <text x="26" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">HOW EACH SLIDER MOVES THE RANGE</text>

    <g transform="translate(26, 66)">
      <text y="18" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="600" fill="#f9f6f0">01 · Project Shape (Marketing Site → Storefront / MVP)</text>
      <rect y="30" width="624" height="14" rx="7" fill="#0d1116"/>
      <rect y="30" width="468" height="14" rx="7" fill="#ff7a5c"/>

      <text y="88" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="600" fill="#f9f6f0">02 · Screen &amp; Workflow Depth (Pages / Views)</text>
      <rect y="100" width="624" height="14" rx="7" fill="#0d1116"/>
      <rect y="100" width="380" height="14" rx="7" fill="#ff7a5c" fill-opacity="0.82"/>

      <text y="158" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="600" fill="#f9f6f0">03 · Design Depth (Clean Base vs Bespoke Visual System)</text>
      <rect y="170" width="624" height="14" rx="7" fill="#0d1116"/>
      <rect y="170" width="330" height="14" rx="7" fill="#ff7a5c" fill-opacity="0.68"/>

      <text y="228" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="600" fill="#f9f6f0">04 · External Integrations (Stripe, CRM, Auth, n8n)</text>
      <rect y="240" width="624" height="14" rx="7" fill="#0d1116"/>
      <rect y="240" width="420" height="14" rx="7" fill="#ff7a5c" fill-opacity="0.82"/>

      <text y="298" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="600" fill="#f9f6f0">05 · Timeline Compression (Standard vs Rush Delivery)</text>
      <rect y="310" width="624" height="14" rx="7" fill="#0d1116"/>
      <rect y="310" width="260" height="14" rx="7" fill="#6f8391"/>

      <text y="372" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a9abb2">Trimming v1 screens &amp; integrations lowers range cleanly without cutting QA.</text>
    </g>

    <!-- Right Output Explainer -->
    <g transform="translate(706, 0)">
      <rect width="382" height="482" rx="12" fill="#12181e" stroke="#ff7a5c" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="26" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#ff7a5c">OUTPUT INTERPRETATION</text>
      <text x="26" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="600" fill="#f9f6f0">Low ↔ High Band</text>
      <rect x="26" y="102" width="330" height="92" rx="10" fill="#0d1116" stroke="#26323b"/>
      <text x="44" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a9abb2">Indicative range accounts for</text>
      <text x="44" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#f9f6f0">unknown edge cases, data</text>
      <text x="44" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#f9f6f0">migration &amp; copy readiness.</text>

      <text x="26" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" fill="#f9f6f0">What happens after estimating?</text>
      <text x="26" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">01 · Share goals &amp; key user flow</text>
      <text x="26" y="300" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">02 · Lock lean v1 milestone scope</text>
      <text x="26" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#d9d7d2">03 · Receive plain written quote</text>

      <rect x="26" y="378" width="330" height="76" rx="10" fill="#1c1818" stroke="#ff7a5c" stroke-opacity="0.45"/>
      <text x="42" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="600" fill="#ff7a5c">Honest planning tool</text>
      <text x="42" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#e6dedb">Illustrative band only — never a fixed price list.</text>
    </g>
  </g>
  
</svg>
